<!DOCTYPE html>

  <style>

    }

    body {

      color: #222;
    }

    .container {

    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    h1,
    h2 {
      margin-top: 0;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      border: 0;
      background: #111;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {

    }

    .logout {

    }

    .danger {
      background: #c62828;
    }

    .hidden {
      display: none;
    }

    .status {
      padding: 12px;
      background: #eee;
      border-radius: 8px;
      margin-top: 10px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));

// -------------------------
// LOGIN
// -------------------------
  async function login() {
console.log("LOGIN SCRIPT CARGADO");
  const status =
    document.getElementById("loginStatus");

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  status.textContent =
    "🔄 Conectando...";

  if (!email || !password) {

    status.textContent =
      "❌ Completá email y contraseña.";

    return;
  }

  try {

    status.textContent =
      "🔄 Verificando usuario...";

    const result =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    console.log("Resultado login:", result);

    if (result.error) {

      status.textContent =
        "❌ Error de Supabase: " +
        result.error.message;

      return;
    }

    if (!result.data.user) {

      status.textContent =
        "❌ Supabase no devolvió ningún usuario.";

      return;
    }

    if (result.data.user.id !== ADMIN_ID) {

      await supabaseClient.auth.signOut();

      status.textContent =
        "❌ Esta cuenta no tiene permisos de administrador.";

      return;
    }

    status.textContent =
      "✅ Login correcto. Cargando panel...";

    await showAdmin();

  } catch (error) {

    console.error("Error de login:", error);

    status.textContent =
      "❌ Error: " + error.message;
  }


  showAdmin();

}

async function checkSession() {

  const { data } =
    await supabaseClient.auth.getSession();

  const user =
    data.session?.user;

  if (user && user.id === ADMIN_ID) {

    showAdmin();

  }

}


// -------------------------
// CERRAR SESION
// -------------------------

async function logout() {

  await supabaseClient.auth.signOut();

  location.reload();

}


// -------------------------
// SUBIR FOTO
// -------------------------

async function uploadImage(file) {

  if (!file) {
    throw new Error("No seleccionaste ninguna foto.");
  }

  const extension =
    file.name.split(".").pop().toLowerCase();

  const fileName =
    `${ADMIN_ID}/${crypto.randomUUID()}.${extension}`;

  const { error } =
    await supabaseClient
      .storage
      .from("product-images")
      .upload(
        fileName,
        file,
        {
          cacheControl: "3600",
          upsert: false
        }
      );

  if (error) {
    throw new Error(
      "No se pudo subir la foto: " +
      error.message
    );
  }

  const { data } =
    supabaseClient
      .storage
      .from("product-images")
      .getPublicUrl(fileName);

  return data.publicUrl;
}
